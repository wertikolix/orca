name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Build and test
        run: ./gradlew --no-daemon --build-cache :orca-core:jvmTest :orca-compose:testDebugUnitTest :orca-compose:compileKotlinDesktop :orca-compose:compileKotlinIosSimulatorArm64 :orca-compose-material3:testDebugUnitTest :orca-compose-material3:assembleRelease :orca-compose-material3:compileKotlinDesktop :orca-compose-material3:compileKotlinIosSimulatorArm64 :orca-images-coil:assembleRelease :orca-images-coil:compileKotlinDesktop :orca-images-coil:compileKotlinIosSimulatorArm64 :orca-math-orcex:assembleRelease :orca-math-orcex:compileKotlinDesktop :orca-math-orcex:compileKotlinIosSimulatorArm64 :sample-app:assembleDebug

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-reports-${{ github.run_id }}
          path: |
            orca-core/build/reports/
            orca-compose/build/reports/
            orca-compose-material3/build/reports/
            orca-images-coil/build/reports/
            orca-math-orcex/build/reports/
            sample-app/build/reports/
            sample-app/build/outputs/logs/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7

  benchmarks:
    # Parser regressions are the kind that pass every test and only show up as a
    # sluggish stream, so the scaling checks run on every push and every pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run parser benchmarks
        run: |
          ./gradlew --no-daemon --build-cache :orca-benchmarks:run \
            --args="--check --markdown ${GITHUB_WORKSPACE}/benchmark-report.md --json ${GITHUB_WORKSPACE}/benchmark-report.json"

      - name: Publish benchmark summary
        if: always()
        run: |
          if [[ -f benchmark-report.md ]]; then
            cat benchmark-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report-${{ github.run_id }}
          path: |
            benchmark-report.md
            benchmark-report.json
          if-no-files-found: ignore
          retention-days: 30

  gradle-warnings:
    needs: build-and-test
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Run warning-mode build (non-blocking)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --build-cache --warning-mode all :sample-app:assembleDebug 2>&1 | tee gradle-warning-mode.log

      - name: Upload warning-mode log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-warning-mode-log-${{ github.run_id }}
          path: gradle-warning-mode.log
          if-no-files-found: ignore
          retention-days: 7
