name: Release

on:
  push:
    tags:
      - "0.*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install Android SDK packages
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Resolve release version
        id: release-version
        run: |
          set -euo pipefail
          PROJECT_VERSION="$(./gradlew -q properties | awk '/^version: / {print $2; exit}')"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ ! "${VERSION}" =~ ^0\.[0-9]+\.[0-9]+(-(alpha|beta|rc)([.-]?[0-9]+)?)?$ ]]; then
              echo "::error::Release tag '${VERSION}' is not a supported semantic version."
              exit 1
            fi
            if [[ "${VERSION}" != "${PROJECT_VERSION}" ]]; then
              echo "::error::Release tag '${VERSION}' does not match project version '${PROJECT_VERSION}'."
              exit 1
            fi
          else
            VERSION="${PROJECT_VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved release version: ${VERSION}"

      - name: Build tests and release artifacts
        run: ./gradlew --no-daemon --build-cache :orca-core:jvmTest :orca-compose:testDebugUnitTest :orca-compose:assembleRelease :orca-compose:compileKotlinDesktop :orca-compose:compileKotlinIosSimulatorArm64 :orca-compose-material3:testDebugUnitTest :orca-compose-material3:assembleRelease :orca-compose-material3:compileKotlinDesktop :orca-compose-material3:compileKotlinIosSimulatorArm64 :orca-images-coil:assembleRelease :orca-images-coil:compileKotlinDesktop :orca-images-coil:compileKotlinIosSimulatorArm64 :orca-math-orcex:assembleRelease :orca-math-orcex:compileKotlinDesktop :orca-math-orcex:compileKotlinIosSimulatorArm64 :orca-core:jvmJar :sample-app:assembleRelease :sample-app:bundleRelease -PorcaVersion=${{ steps.release-version.outputs.version }}

      - name: Validate Maven Central release secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0
          for name in CENTRAL_TOKEN_USERNAME CENTRAL_TOKEN_PASSWORD GPG_PRIVATE_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required release secret ${name} is missing."
              missing=1
            fi
          done
          exit "${missing}"

      - name: Prepare signing key for Gradle
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          key_material="${GPG_PRIVATE_KEY//$'\r'/}"
          if [[ "${key_material}" == *"\\n"* ]]; then
            key_material="${key_material//\\n/$'\n'}"
          fi
          if [[ "${key_material}" != *"BEGIN PGP PRIVATE KEY BLOCK"* ]]; then
            key_material="$(printf '%s' "${key_material}" | base64 --decode)"
          fi

          {
            echo "ORG_GRADLE_PROJECT_signingInMemoryKey<<EOF"
            printf '%s\n' "${key_material}"
            echo "EOF"
            echo "SIGNING_IN_MEMORY_KEY<<EOF"
            printf '%s\n' "${key_material}"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [[ -n "${GPG_PASSPHRASE}" ]]; then
            echo "ORG_GRADLE_PROJECT_signingInMemoryKeyPassword=${GPG_PASSPHRASE}" >> "$GITHUB_ENV"
            echo "SIGNING_IN_MEMORY_KEY_PASSWORD=${GPG_PASSPHRASE}" >> "$GITHUB_ENV"
          fi

      - name: Publish to Maven Central
        if: startsWith(github.ref, 'refs/tags/')
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --build-cache \
            :orca-core:publishAllPublicationsToCentralStagingRepository \
            :orca-compose:publishAllPublicationsToCentralStagingRepository \
            :orca-compose-material3:publishAllPublicationsToCentralStagingRepository \
            :orca-images-coil:publishAllPublicationsToCentralStagingRepository \
            :orca-math-orcex:publishAllPublicationsToCentralStagingRepository \
            -PorcaVersion=${{ steps.release-version.outputs.version }} \
            -PcentralTokenUsername=${CENTRAL_TOKEN_USERNAME} \
            -PcentralTokenPassword=${CENTRAL_TOKEN_PASSWORD}

          # Trigger automatic publishing on the staging repo. The staging repo may not be
          # ready immediately after upload, so retry before failing the release.
          auth="$(printf '%s' "${CENTRAL_TOKEN_USERNAME}:${CENTRAL_TOKEN_PASSWORD}" | base64 -w0)"
          publish_url="https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/ru.wertik?publishing_type=automatic"
          max_attempts=3
          delay=10
          triggered=false
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Attempt ${attempt}/${max_attempts}: POST ${publish_url}"
            if curl -fsS -X POST \
              -H "Authorization: Bearer ${auth}" \
              "${publish_url}"; then
              echo "Automatic publishing triggered successfully."
              triggered=true
              break
            else
              echo "::warning::Attempt ${attempt}/${max_attempts} to trigger automatic publishing failed (curl exit code: $?)."
              if [[ "${attempt}" -lt "${max_attempts}" ]]; then
                echo "Retrying in ${delay}s…"
                sleep "${delay}"
              else
                echo "::error::All ${max_attempts} attempts to trigger automatic publishing failed."
              fi
            fi
          done
          if [[ "${triggered}" != "true" ]]; then
            exit 1
          fi

      - name: Verify Maven Central publication
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION: ${{ steps.release-version.outputs.version }}
        run: |
          set -euo pipefail
          artifacts=(orca-core orca-compose orca-compose-material3 orca-images-coil orca-math-orcex)
          max_attempts=20
          delay=30
          for artifact in "${artifacts[@]}"; do
            url="https://repo1.maven.org/maven2/ru/wertik/${artifact}/${VERSION}/${artifact}-${VERSION}.pom"
            available=false
            for attempt in $(seq 1 "${max_attempts}"); do
              if curl -fsS --retry 2 --retry-delay 2 "${url}" >/dev/null; then
                echo "Verified ${artifact}:${VERSION}."
                available=true
                break
              fi
              echo "Waiting for ${artifact}:${VERSION} (${attempt}/${max_attempts})..."
              sleep "${delay}"
            done
            if [[ "${available}" != "true" ]]; then
              echo "::error::${artifact}:${VERSION} was not visible on Maven Central after verification retries."
              exit 1
            fi
          done

      - name: Upload release artifacts to workflow
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: |
            orca-compose/build/outputs/aar/orca-compose-release.aar
            orca-compose-material3/build/outputs/aar/orca-compose-material3-release.aar
            orca-images-coil/build/outputs/aar/orca-images-coil-release.aar
            orca-math-orcex/build/outputs/aar/orca-math-orcex-release.aar
            orca-core/build/libs/orca-core*.jar
            sample-app/build/outputs/apk/release/*.apk
            sample-app/build/outputs/bundle/release/*.aab
            sample-app/build/outputs/apk/release/output-metadata.json
          if-no-files-found: error
          retention-days: 14

      - name: Create or update GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${TAG}.md"

          prerelease_flag=""
          if [[ "$TAG" == *-alpha* || "$TAG" == *-beta* || "$TAG" == *-rc* ]]; then
            prerelease_flag="--prerelease"
          fi

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ -f "$NOTES_FILE" ]]; then
              gh release create "$TAG" --title "$TAG" $prerelease_flag --notes-file "$NOTES_FILE"
            else
              gh release create "$TAG" --title "$TAG" $prerelease_flag --generate-notes
            fi
          fi

      - name: Upload APK/AAB to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          assets=()

          if [[ -f orca-compose/build/outputs/aar/orca-compose-release.aar ]]; then
            assets+=(orca-compose/build/outputs/aar/orca-compose-release.aar)
          fi

          if [[ -f orca-compose-material3/build/outputs/aar/orca-compose-material3-release.aar ]]; then
            assets+=(orca-compose-material3/build/outputs/aar/orca-compose-material3-release.aar)
          fi

          if [[ -f orca-images-coil/build/outputs/aar/orca-images-coil-release.aar ]]; then
            assets+=(orca-images-coil/build/outputs/aar/orca-images-coil-release.aar)
          fi

          if [[ -f orca-math-orcex/build/outputs/aar/orca-math-orcex-release.aar ]]; then
            assets+=(orca-math-orcex/build/outputs/aar/orca-math-orcex-release.aar)
          fi

          core_jar_files=(orca-core/build/libs/orca-core*.jar)
          for jar in "${core_jar_files[@]}"; do
            [[ -e "$jar" ]] || continue
            if [[ "$jar" == *-sources.jar || "$jar" == *-javadoc.jar ]]; then
              continue
            fi
            assets+=("$jar#orca-core.jar")
            break
          done

          apk_files=(sample-app/build/outputs/apk/release/*.apk)
          if [[ -e "${apk_files[0]}" ]]; then
            assets+=("${apk_files[@]}")
          fi

          aab_files=(sample-app/build/outputs/bundle/release/*.aab)
          if [[ -e "${aab_files[0]}" ]]; then
            assets+=("${aab_files[@]}")
          fi

          if [[ ${#assets[@]} -eq 0 ]]; then
            echo "No release assets found to upload."
            exit 1
          fi

          gh release upload "$TAG" "${assets[@]}" --clobber

      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-failure-reports-${{ github.run_id }}
          path: |
            orca-core/build/reports/
            orca-compose/build/reports/
            orca-compose-material3/build/reports/
            orca-images-coil/build/reports/
            orca-math-orcex/build/reports/
            sample-app/build/reports/
            sample-app/build/outputs/logs/
            build/reports/problems/
          if-no-files-found: ignore
          retention-days: 7
